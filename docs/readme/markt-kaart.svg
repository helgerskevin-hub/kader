<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240" role="img" aria-labelledby="titel omschrijving">
  <title id="titel">Kaart op Markt (voorbeeld)</title>
  <desc id="omschrijving">Voorbeeld van een kaart op het scherm Markt voor een verzonnen munt, Voorbeeldcoin (VB): de score 64 als ring rond het logo, de koers 100 dollar met plus 6,9 procent over 30 dagen, een koersgrafiek van 30 dagen, de badge KOOPZONE met score 64 en de verhouding risico en opbrengst 1 : 2.4.</desc>
  <style>
    svg {
      --kaart: #FFFFFF; --verhoogd: #EEF2F7; --rand: #E2E8F0; --tekst: #0F172A; --gedimd: #64748B;
      --primair: #1E3A8A; --winst: #16A34A;
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg { --kaart: #161B22; --verhoogd: #1C2230; --rand: #2A3140; --tekst: #E6EDF3; --gedimd: #8B949E;
            --primair: #3B82F6; --winst: #22C55E; }
    }
    .kaart { fill: var(--kaart); stroke: var(--rand); stroke-width: 1; }
    .vlak { fill: var(--verhoogd); }
    .spoor { fill: none; stroke: var(--verhoogd); stroke-width: 4; }
    .boog { fill: none; stroke: var(--primair); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 100 200; stroke-dashoffset: 36; }
    .monogram { fill: var(--gedimd); }
    .monogramTekst { font-family: var(--sans); font-weight: 700; font-size: 13px; fill: var(--kaart); }
    .symbool { font-family: var(--sans); font-weight: 600; font-size: 18px; fill: var(--tekst); }
    .naam { font-family: var(--sans); font-weight: 400; font-size: 13px; fill: var(--gedimd); }
    .prijs { font-family: var(--mono); font-weight: 600; font-size: 20px; fill: var(--tekst); }
    .pil { fill: var(--winst); fill-opacity: .12; }
    .pilTekst { font-family: var(--mono); font-weight: 500; font-size: 12.5px; fill: var(--winst); }
    .lijn { fill: none; stroke: var(--winst); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .vlakGrafiek { fill: url(#verloop); }
    .eindStip { fill: var(--winst); }
    .badge { fill: var(--winst); fill-opacity: .10; }
    .badgeTekst { font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: .9px; fill: var(--winst); }
    .chip { font-family: var(--mono); font-weight: 500; font-size: 12.5px; fill: var(--gedimd); }
    .pijl { fill: none; stroke: var(--gedimd); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .verloopTop { stop-color: var(--winst); stop-opacity: .22; }
    .verloopOnder { stop-color: var(--winst); stop-opacity: 0; }

    /* Eén keer landen bij het laden, zoals op Markt (duur.lang, curve.binnen), daarna ademt alleen
       de eindstip nog, met een ruime pauze. */
    .boog { animation: boog .4s cubic-bezier(0.22, 1, 0.36, 1) .3s both; }
    @keyframes boog { from { stroke-dashoffset: 100.5; } to { stroke-dashoffset: 36; } }
    .onthul { transform-box: fill-box; transform-origin: left center; animation: onthul 1.1s cubic-bezier(0.22, 1, 0.36, 1) .45s both; }
    @keyframes onthul { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .eindStip { transform-box: fill-box; transform-origin: center; animation: pop .35s cubic-bezier(0.22, 1, 0.36, 1) 1.4s both; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .halo { opacity: 0; fill: var(--winst); transform-box: fill-box; transform-origin: center; animation: adem 5s cubic-bezier(0.25, 0.1, 0.25, 1) 2s infinite; }
    @keyframes adem { 0% { transform: scale(1); opacity: .45; } 40% { transform: scale(3); opacity: 0; } 100% { transform: scale(3); opacity: 0; } }
    .voet { animation: voet .5s cubic-bezier(0.22, 1, 0.36, 1) .6s both; }
    @keyframes voet { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .halo { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="verloop" x1="0" y1="106" x2="0" y2="164" gradientUnits="userSpaceOnUse">
      <stop class="verloopTop" offset="0"/>
      <stop class="verloopOnder" offset="1"/>
    </linearGradient>
    <mask id="grafiekMasker" maskUnits="userSpaceOnUse" x="0" y="0" width="460" height="240">
      <rect class="onthul" x="20" y="96" width="424" height="72" fill="#FFFFFF"/>
    </mask>
  </defs>

  <rect class="kaart" x="0.5" y="0.5" width="459" height="239" rx="20"/>

  <!-- Kop: score als ring rond het logo (hier een monogram, want dit is geen echte munt) -->
  <circle class="spoor" cx="52" cy="54" r="26"/>
  <circle class="boog" cx="52" cy="54" r="26" pathLength="100" transform="rotate(-90 52 54)"/>
  <circle class="monogram" cx="52" cy="54" r="19"/>
  <text class="monogramTekst" x="52" y="58.5" text-anchor="middle">VB</text>
  <text class="symbool" x="94" y="50">VB</text>
  <text class="naam" x="94" y="70">Voorbeeldcoin</text>
  <text class="prijs" x="436" y="50" text-anchor="end">$100.00</text>
  <rect class="pil" x="324" y="60" width="112" height="24" rx="12"/>
  <text class="pilTekst" x="380" y="76.5" text-anchor="middle">+6.9% · 30D</text>

  <!-- Koers over 30 dagen -->
  <g mask="url(#grafiekMasker)">
    <path class="vlakGrafiek" d="M24.0 135.3 L37.7 140.6 L51.5 139.0 L65.2 141.2 L78.9 138.3 L92.7 134.9 L106.4 144.0 L120.1 154.1 L133.9 146.2 L147.6 150.9 L161.3 156.0 L175.1 144.8 L188.8 144.9 L202.5 136.9 L216.3 136.8 L230.0 133.0 L243.7 140.3 L257.5 136.6 L271.2 127.8 L284.9 126.6 L298.7 120.4 L312.4 115.8 L326.1 125.4 L339.9 118.8 L353.6 116.0 L367.3 120.0 L381.1 130.2 L394.8 121.3 L408.5 121.3 L422.3 115.6 L436.0 106.0 L436 164 L24 164 Z"/>
    <path class="lijn" d="M24.0 135.3 L37.7 140.6 L51.5 139.0 L65.2 141.2 L78.9 138.3 L92.7 134.9 L106.4 144.0 L120.1 154.1 L133.9 146.2 L147.6 150.9 L161.3 156.0 L175.1 144.8 L188.8 144.9 L202.5 136.9 L216.3 136.8 L230.0 133.0 L243.7 140.3 L257.5 136.6 L271.2 127.8 L284.9 126.6 L298.7 120.4 L312.4 115.8 L326.1 125.4 L339.9 118.8 L353.6 116.0 L367.3 120.0 L381.1 130.2 L394.8 121.3 L408.5 121.3 L422.3 115.6 L436.0 106.0"/>
  </g>
  <circle class="halo" cx="436" cy="106" r="4"/>
  <circle class="eindStip" cx="436" cy="106" r="4"/>

  <!-- Voet: oordeel met score, R/R en uitklappijl -->
  <g class="voet">
    <rect class="badge" x="24" y="186" width="128" height="28" rx="14"/>
    <text class="badgeTekst" x="88" y="204.5" text-anchor="middle">KOOPZONE · 64</text>
    <rect class="vlak" x="160" y="186" width="104" height="28" rx="14"/>
    <text class="chip" x="212" y="204.5" text-anchor="middle">R/R 1 : 2.4</text>
    <circle class="vlak" cx="422" cy="200" r="14"/>
    <path class="pijl" d="M416.5 197.5 L422 203 L427.5 197.5"/>
  </g>
</svg>
